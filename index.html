<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Склад 36×36 м — Исправленные стеллажи</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #1a1a2e; }
        #controls {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.9); padding: 15px; border-radius: 8px;
            font-size: 13px; line-height: 1.5; max-width: 400px; z-index: 100;
        }
        #controls h2 { margin: 0 0 10px 0; color: #ffd700; font-size: 16px; }
        .btn {
            display: block; width: 100%; padding: 10px; margin: 5px 0;
            background: #333; color: white; border: 2px solid #555;
            border-radius: 5px; cursor: pointer; font-size: 13px; text-align: left;
        }
        .btn:hover { background: #444; }
        .btn.active { background: #ffd700; color: #000; border-color: #ffd700; }
        .legend { display: flex; align-items: center; margin: 3px 0; font-size: 12px; }
        .color-box { width: 14px; height: 14px; margin-right: 8px; border: 1px solid #555; flex-shrink: 0; }
        #info {
            position: absolute; bottom: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px;
            font-size: 12px; max-width: 400px;
        }
    </style>
</head>
<body>
<div id="controls">
    <h2>🏭 Склад 36×36 м</h2>
    <button class="btn active" onclick="showVariant(1)">1️⃣ Вариант 1: 4 стеллажа</button>
    <button class="btn" onclick="showVariant(2)">2️⃣ Вариант 2: 2 длинных стеллажа</button>
    <button class="btn" onclick="showVariant(3)">3️⃣ Вариант 3: 2 высоких стеллажа</button>
    <hr style="border-color:#555; margin: 10px 0;">
    <div class="legend"><div class="color-box" style="background:#e8d44d"></div>Колонны (15 шт)</div>
    <div class="legend"><div class="color-box" style="background:#888"></div>Второй этаж (14×31 м)</div>
    <div class="legend"><div class="color-box" style="background:#4a90e2"></div>Офис 14×4 м</div>
    <div class="legend"><div class="color-box" style="background:#e74c3c"></div>Санузел+котельная</div>
    <div class="legend"><div class="color-box" style="background:#2c3e50"></div>Ворота (4×4 м)</div>
    <div class="legend"><div class="color-box" style="background:#4682B4"></div>Лестница на 2-й этаж</div>
    <div class="legend"><div class="color-box" style="background:#2ecc71"></div>Стеллажи</div>
    <div class="legend"><div class="color-box" style="background:#8B4513"></div>Паллеты</div>
    <div class="legend"><div class="color-box" style="background:#ffd700"></div>Штабелер</div>
</div>

<div id="info">
    <b>Управление:</b> ЛКМ — вращение | ПКМ — перемещение | Колесо — зум
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ===== СЦЕНА =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 60, 200);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(50, 40, 50);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;

// ===== ОСВЕЩЕНИЕ =====
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(30, 50, 30);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

// ===== МАТЕРИАЛЫ =====
const matFloor = new THREE.MeshStandardMaterial({color: 0x8a8a8a, roughness: 0.9});
const matWall = new THREE.MeshStandardMaterial({color: 0xe8d44d, transparent: true, opacity: 0.15, side: THREE.DoubleSide});
const matColumn = new THREE.MeshStandardMaterial({color: 0xe8d44d});
const matStripe = new THREE.MeshStandardMaterial({color: 0xff6600});
const matMezz = new THREE.MeshStandardMaterial({color: 0x888888, transparent: true, opacity: 0.9});
const matMezzWall = new THREE.MeshStandardMaterial({color: 0xaaaaaa, transparent: true, opacity: 0.6});
const matOffice = new THREE.MeshStandardMaterial({color: 0x4a90e2, transparent: true, opacity: 0.8});
const matBath = new THREE.MeshStandardMaterial({color: 0xe74c3c, transparent: true, opacity: 0.8});
const matGate = new THREE.MeshStandardMaterial({color: 0x2c3e50});
const matPallet = new THREE.MeshStandardMaterial({color: 0x8B4513});
const matStacker = new THREE.MeshStandardMaterial({color: 0xffd700});
const matStairs = new THREE.MeshStandardMaterial({color: 0x4682B4});
const matRack = new THREE.MeshStandardMaterial({color: 0x2ecc71});
const matRackBeam = new THREE.MeshStandardMaterial({color: 0xe67e22});

// ===== ПОЛ 36×36 =====
const floor = new THREE.Mesh(new THREE.PlaneGeometry(36, 36), matFloor);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(36, 36, 0x555555, 0x333333);
grid.position.y = 0.01;
scene.add(grid);

// ===== СТЕНЫ =====
function addWall(x, y, z, w, h, d) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matWall);
    wall.position.set(x, y, z);
    scene.add(wall);
}
addWall(0, 2.5, -18, 36, 5, 0.2);
addWall(0, 2.5, 18, 36, 5, 0.2);
addWall(-18, 2.5, 0, 0.2, 5, 36);
addWall(18, 2.5, 0, 0.2, 5, 36);

// ===== ВТОРОЙ ЭТАЖ (14×31 м) =====
const mezzFloor = new THREE.Mesh(new THREE.BoxGeometry(14, 0.3, 31), matMezz);
mezzFloor.position.set(0, 3.5, -2.5);
mezzFloor.castShadow = true;
mezzFloor.receiveShadow = true;
scene.add(mezzFloor);

const mezzWalls = [
    {pos: [0, 4.25, 13], size: [14, 1.5, 0.2]},
    {pos: [-7, 4.25, -2.5], size: [0.2, 1.5, 31]},
    {pos: [7, 4.25, -2.5], size: [0.2, 1.5, 31]}
];
mezzWalls.forEach(w => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(...w.size), matMezzWall);
    mesh.position.set(...w.pos);
    scene.add(mesh);
});

// ===== 15 КОЛОНН =====
const colX = [-6.5, 0.5, 6.5];
const colZ = [-11.5, -5.5, 0.5, 6.5, 12.5];
colX.forEach((x) => {
    colZ.forEach((z) => {
        const col = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.5, 0.4), matColumn);
        col.position.set(x, 1.75, z);
        col.castShadow = true;
        scene.add(col);
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1, 0.42), matStripe);
        stripe.position.set(x, 0.5, z);
        scene.add(stripe);
    });
});

// ===== ОФИС (L33:Y36) =====
const office = new THREE.Mesh(new THREE.BoxGeometry(14, 3, 4), matOffice);
office.position.set(0, 1.5, 16);
office.castShadow = true;
scene.add(office);

// ===== САНУЗЕЛ (A30:D36) =====
const bath = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 7), matBath);
bath.position.set(-16, 1.5, 14.5);
bath.castShadow = true;
scene.add(bath);

// ===== ВОРОТА =====
function addGate(x, z, label) {
    const gate = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 0.3), matGate);
    gate.position.set(x, 2, z);
    scene.add(gate);
    addLabel(label, [x, 5, z], 3);
}
addGate(10, -17.9, 'В1');
addGate(-10, -17.9, 'В2');
addGate(10, 17.9, 'В3');

// ===== ЛЕСТНИЦА (G32:K36) =====
const stairX = -9.5;
const stairZStart = 18;
const stairZEnd = 13;
const stairHeight = 3.5;
const numSteps = 14;
const stairLength = Math.abs(stairZEnd - stairZStart);
const stairIncline = Math.atan2(stairHeight, stairLength);

const stairBase = new THREE.Mesh(new THREE.BoxGeometry(5, 0.15, stairLength), matStairs);
stairBase.position.set(stairX, stairHeight / 2, (stairZStart + stairZEnd) / 2);
stairBase.rotation.x = stairIncline;
stairBase.castShadow = true;
scene.add(stairBase);

for (let i = 0; i < numSteps; i++) {
    const t = i / numSteps;
    const step = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.2, 0.3), matStairs);
    step.position.set(stairX, stairHeight * t + 0.1, stairZStart - t * stairLength);
    step.castShadow = true;
    scene.add(step);
}

// ===== МЕЛКИЕ ОБЪЕКТЫ =====
const panel = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.3), new THREE.MeshStandardMaterial({color: 0xff6600}));
panel.position.set(16.5, 0.6, 17.5);
scene.add(panel);

const stacker = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 1.8), matStacker);
stacker.position.set(15.5, 0.75, 16.5);
stacker.castShadow = true;
scene.add(stacker);
const mast = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.5, 0.1), new THREE.MeshStandardMaterial({color: 0x333333}));
mast.position.set(15.5, 1.25, 16);
scene.add(mast);

for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 12; col++) {
        const px = -6 + col * 1;
        const pz = -17 + row * 0.9;
        const pallet = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 0.8), matPallet);
        pallet.position.set(px, 0.075, pz);
        scene.add(pallet);
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.7, 0.75), matPallet);
        box.position.set(px, 1.0, pz);
        box.castShadow = true;
        scene.add(box);
    }
}

const sofa = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 0.9), new THREE.MeshStandardMaterial({color: 0x9370DB}));
sofa.position.set(16.5, 0.4, -16.5);
scene.add(sofa);

const cabinet = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.5), new THREE.MeshStandardMaterial({color: 0x708090}));
cabinet.position.set(15.5, 0.4, -16.5);
scene.add(cabinet);

const desk = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 0.6), new THREE.MeshStandardMaterial({color: 0xDEB887}));
desk.position.set(13.5, 0.75, -16.5);
scene.add(desk);

const server = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2, 0.8), new THREE.MeshStandardMaterial({color: 0x2F4F4F}));
server.position.set(-16.5, 1, 9.5);
scene.add(server);

// ===== ГРУППЫ ВАРИАНТОВ =====
const variant1Group = new THREE.Group();
const variant2Group = new THREE.Group();
const variant3Group = new THREE.Group();
scene.add(variant1Group);
scene.add(variant2Group);
scene.add(variant3Group);

// Функция создания стеллажа
function createRack(x, z, width, depth, height, numLevels, beamHeights, group) {
    const numPolesZ = Math.floor(depth / 2.7) + 1;
    const spacingZ = depth / (numPolesZ - 1);
    
    // Стойки (2 ряда по ширине)
    for (let i = 0; i < numPolesZ; i++) {
        const pz = z - depth/2 + i * spacingZ;
        for (let side = -1; side <= 1; side += 2) {
            const px = x + side * width/2;
            const pole = new THREE.Mesh(new THREE.BoxGeometry(0.1, height, 0.1), matRack);
            pole.position.set(px, height/2, pz);
            pole.castShadow = true;
            group.add(pole);
        }
    }
    
    // Балки и паллеты
    for (let level = 0; level < numLevels; level++) {
        const beamY = beamHeights[level];
        for (let i = 0; i < numPolesZ - 1; i++) {
            const pz = z - depth/2 + i * spacingZ + spacingZ/2;
            for (let side = -1; side <= 1; side += 2) {
                const px = x + side * width/2;
                const beam = new THREE.Mesh(new THREE.BoxGeometry(width, 0.1, spacingZ), matRackBeam);
                beam.position.set(px, beamY, pz);
                group.add(beam);
            }
            
            // Паллеты (2 штуки на секцию по ширине)
            for (let p = 0; p < 2; p++) {
                const px = x - width/4 + p * width/2;
                const palletY = level === 0 ? 0.075 : beamY + 0.075;
                const pallet = new THREE.Mesh(new THREE.BoxGeometry(width/2 - 0.1, 0.15, 0.75), matPallet);
                pallet.position.set(px, palletY, pz);
                group.add(pallet);
                
                const boxH = 1.5;
                const box = new THREE.Mesh(new THREE.BoxGeometry(width/2 - 0.15, boxH, 0.7), matPallet);
                box.position.set(px, palletY + 0.075 + boxH/2, pz);
                box.castShadow = true;
                group.add(box);
            }
        }
    }
}

// ===== ВАРИАНТ 1: 4 стеллажа =====
function buildVariant1() {
    // Стеллаж 1 (AJ25:AJ35): X=17.5, Z=11.5, длина 11 м
    createRack(17.5, 11.5, 1, 11, 2.5, 2, [0, 1.2], variant1Group);
    // Стеллаж 2 (AF25:AF35): X=13.5, Z=11.5, длина 11 м
    createRack(13.5, 11.5, 1, 11, 2.5, 2, [0, 1.2], variant1Group);
    // Стеллаж 3 (A1:A12): X=-17.5, Z=-12, длина 12 м
    createRack(-17.5, -12, 1, 12, 2.5, 2, [0, 1.2], variant1Group);
    // Стеллаж 4 (E1:E12): X=-13.5, Z=-12, длина 12 м
    createRack(-13.5, -12, 1, 12, 2.5, 2, [0, 1.2], variant1Group);
    
    addLabel('ВАРИАНТ 1: 4 стеллажа (2,5 м)', [0, 7, 0], 8);
}

// ===== ВАРИАНТ 2: 2 длинных стеллажа =====
function buildVariant2() {
    // Стеллаж 1 (AJ4:AJ35): X=17.5, Z=1, длина 32 м
    createRack(17.5, 1, 1, 32, 2.5, 2, [0, 1.2], variant2Group);
    // Стеллаж 2 (A1:A28): X=-17.5, Z=-4, длина 28 м
    createRack(-17.5, -4, 1, 28, 2.5, 2, [0, 1.2], variant2Group);
    
    addLabel('ВАРИАНТ 2: 2 длинных стеллажа (2,5 м)', [0, 7, 0], 8);
}

// ===== ВАРИАНТ 3: 2 высоких стеллажа =====
function buildVariant3() {
    // Стеллаж 1 (Z19:Z31): X=7.5, Z=6.5, длина 13 м
    createRack(7.5, 6.5, 1, 13, 5, 4, [0, 1.2, 2.5, 3.8], variant3Group);
    // Стеллаж 2 (K17:K29): X=-7.5, Z=4.5, длина 13 м
    createRack(-7.5, 4.5, 1, 13, 5, 4, [0, 1.2, 2.5, 3.8], variant3Group);
    
    addLabel('ВАРИАНТ 3: 2 высоких стеллажа (5 м)', [0, 7, 0], 8);
}

buildVariant1();
buildVariant2();
buildVariant3();

// ===== ПОДПИСИ =====
function addLabel(text, pos, scale = 4) {
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, 1024, 128);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(text, 512, 80);
    const tex = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map: tex}));
    sprite.position.set(...pos);
    sprite.scale.set(scale, scale/8, 1);
    scene.add(sprite);
}

addLabel('ВТОРОЙ ЭТАЖ 14×31 м', [0, 5, -2.5], 6);
addLabel('ОФИС', [0, 4.5, 16], 4);
addLabel('САНУЗЕЛ', [-16, 4.5, 14.5], 3);
addLabel('ЛЕСТНИЦА ', [-9.5, 5, 15.5], 3);

// ===== ПЕРЕКЛЮЧЕНИЕ ВАРИАНТОВ =====
function showVariant(n) {
    variant1Group.visible = (n === 1);
    variant2Group.visible = (n === 2);
    variant3Group.visible = (n === 3);
    document.querySelectorAll('.btn').forEach((btn, i) => {
        btn.classList.toggle('active', i + 1 === n);
    });
}
showVariant(1);

// ===== АНИМАЦИЯ =====
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
